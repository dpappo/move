# Push a tag like v1.1 to build a universal Move.app and attach Move.zip to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build.sh --release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Move.zip --title "Move $GITHUB_REF_NAME" --generate-notes
